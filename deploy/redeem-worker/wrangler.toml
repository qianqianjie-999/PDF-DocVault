#:schema node_modules/wrangler/config-schema.json
name = "docvault-redeem"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# 卡密库:每个卡密一条记录,键为 voucher:<20位卡密>
# 创建: npx wrangler kv namespace create VOUCHERS
[[kv_namespaces]]
binding = "VOUCHERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# 单张卡密允许的换机次数(含首次绑定之外的重绑)
MAX_REBIND = "3"
# 签发套餐名,与客户端 license.plan 对应
PLAN = "full"
# 授权有效期(秒),0 = 永久买断
LICENSE_TTL = "0"

# 私钥不放这里,用 `npx wrangler secret put LICENSE_SIGNING_KEY` 写入
